<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Choose Your Own Adventure</title>
      <link rel="stylesheet" href="./style.css" />
   </head>
   <body>
      <div class="app-shell">
         <section class="story-panel">
            <p class="story-panel__eyebrow">Current scene</p>
            <h1 class="story-panel__title" data-room-title>Loading…</h1>
            <p class="story-panel__description" data-room-description>The night hangs heavy…</p>
            <div class="story-options" data-room-options></div>
            <p class="story-panel__feedback" data-story-feedback hidden></p>
         </section>

         <aside class="grid-panel">
            <h2>Unlocked Endings</h2>
            <div class="endings-grid" data-endings-grid></div>
         </aside>
      </div>

      <script type="module" src="./main.js"></script>
   </body>
</html>
